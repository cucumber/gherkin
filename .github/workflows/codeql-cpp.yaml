name: codeql-cpp

permissions: { }

on:
  push:
    branches:
      - main
    paths:
      - cpp/**
      - Makefile
      - testdata/**
      - .github/**
  pull_request:
    branches:
      - main
    paths:
      - cpp/**
      - Makefile
      - testdata/**
      - .github/**
  schedule:
    - cron: '48 5 * * 0'

concurrency:
  # Cancels in-progress runs only for pull requests
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ github.ref }}
          append-timestamp: false
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev

      - name: Install cucumber/messages
        uses: cucumber/ci-actions/install-cpp-dep@8bbc6bac84313ef426e8a0e6ffa64659d0dc174b
        with:
          dependency: dependencies/messages.version
          working-directory: cpp

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: c-cpp
          build-mode: manual
          tools: linked

      - name: Configure
        working-directory: cpp
        run: cmake --workflow --preset host-system

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:cpp"
