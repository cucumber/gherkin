name: codeql-javascript

permissions: { }

on:
  push:
    branches:
      - main
    paths:
      - javascript/**
      - testdata/**
      - .github/**
  pull_request:
    branches:
      - main
    paths:
      - javascript/**
      - testdata/**
      - .github/**
  schedule:
    - cron: '26 5 * * 1'

concurrency:
  # Cancels in-progress runs only for pull requests
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: 'ubuntu-latest'
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: javascript
          build-mode: none
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:javascript-typescript"
